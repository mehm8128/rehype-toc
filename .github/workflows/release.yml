name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: jdx/mise-action@v3
        with:
          mise_toml: |
            [tools]
            node = "lts"
            pnpm = "latest"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm publish
